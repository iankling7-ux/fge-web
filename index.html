<style>
:root{--bg:#07101f;--panel:#0e1b33;--line:#1d3358;--cy:#38bdf8;--tx:#e8f1ff;--mut:#8aa0c2;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:'Chakra Petch',sans-serif;margin:0}
a{color:var(--cy);text-decoration:none}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-size:22px;font-weight:700;color:#fff;margin-right:auto}.logo b{color:var(--cy)}
header a{color:var(--mut);font-weight:500}header a:hover,header a.on{color:#fff}
main{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
.hero{padding:36px 0 24px}.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.05;max-width:14em}
.hero p{color:var(--mut);max-width:32em}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:19px;margin-bottom:4px}.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#12305a;color:var(--cy)}
.tag.ok{background:#0f3a24;color:var(--ok)}.tag.bad{background:#451a1a;color:var(--bad)}.tag.warn{background:#44340b;color:var(--warn)}
button,.btn{background:var(--cy);color:#04101f;border:0;border-radius:8px;padding:9px 16px;font:600 14px Inter,sans-serif;cursor:pointer;display:inline-block}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--line)}button.del{background:#451a1a;color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
form{display:grid;gap:10px}label{font-size:13px;color:var(--mut);display:grid;gap:4px}
input,select,textarea{background:#091428;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}
.scroll{overflow-x:auto}.tabs{display:flex;gap:8px;margin:16px 0}
.stack>*+*{margin-top:16px}.pos{font-family:'Chakra Petch';font-weight:700;color:var(--cy);width:40px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#04101f;padding:10px 18px;border-radius:8px;font-weight:600;display:none;z-index:9}
header nav{display:flex;flex-wrap:wrap;gap:6px 18px}.logo{text-decoration:none}.logo .fg{display:inline-block;background:var(--cy);color:#04101f;padding:0 6px;margin-right:8px;border-radius:5px;font-style:italic}
.hero2{text-align:center;padding:48px 0 28px;background:radial-gradient(ellipse at top,#0d2a4d,transparent 70%)}.hero2 h1{font-size:clamp(34px,7vw,64px);line-height:1.05}.hero2 h1 span{color:var(--cy)}.hero2 p{color:var(--mut);margin:14px auto 20px;max-width:34em}
.alt2{background:transparent;color:var(--tx);border:1px solid var(--line)}.stats{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);margin:18px 0}.stat{text-align:center}.stat b{display:block;font:700 30px 'Chakra Petch';color:var(--cy)}
.rk{border:1px solid;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600}
.ad{display:flex;gap:12px;align-items:center;position:relative;background:#101f3a;border:1px dashed var(--cy);border-radius:10px;padding:12px;margin:14px 0;cursor:pointer}.ad img{height:56px;border-radius:6px}.adtag{position:absolute;top:-9px;left:10px;background:var(--bg);font-size:11px;color:var(--mut);padding:0 6px}
.ad.mini{margin:0;padding:6px 10px}.ad.mini img{height:36px}#adtop .ad{margin:0;border-radius:0;border-width:0 0 1px}
.adsticky{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;align-items:center;background:var(--panel);border-top:2px solid var(--cy);padding:8px 12px;z-index:8}.adsticky .ad{flex:1}
.pop{position:fixed;inset:0;background:#000c;display:grid;place-items:center;z-index:20;padding:16px}.pop .card{max-width:460px;width:100%;text-align:center}
footer{border-top:1px solid var(--line);padding:24px 20px 100px;color:var(--mut);font-size:14px;text-align:center}
.br{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}.col{min-width:200px;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.m{border:1px solid var(--line);border-radius:8px;background:#091428}.side{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;font-size:14px}
.side+.side{border-top:1px solid var(--line)}.win{color:var(--ok);font-weight:600}.m .ctl{display:flex;gap:4px;padding:6px;border-top:1px solid var(--line)}.m input{width:46px;padding:4px 6px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
/* ===== V7: móvil primero + admin ===== */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,.btn,a,select,label{touch-action:manipulation}
img{max-width:100%}
.mb{display:none;min-width:44px;padding:8px 12px;font-size:20px;line-height:1;align-items:center;justify-content:center}
header{padding-top:max(12px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.adsticky{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#toast{bottom:calc(90px + env(safe-area-inset-bottom));max-width:92vw;text-align:center}
.wheel{max-width:100%;height:auto}.pop{overflow-y:auto}
.mdl{position:fixed;inset:0;background:#000b;z-index:30;overflow-y:auto;padding:max(12px,env(safe-area-inset-top)) 12px 28px;display:flex;justify-content:center;align-items:flex-start}
.mdlc{width:100%;max-width:560px;margin:auto 0}
.dz{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dz p{margin:2px 0 0}
@media(min-width:1100px){main{max-width:1120px}}
@media(max-width:860px){
  header{gap:6px 10px}.mb{display:inline-flex}
  header nav{display:none;width:100%;flex-direction:column;gap:0;padding-top:6px;border-top:1px solid var(--line)}
  header.open nav{display:flex}
  header nav a{padding:13px 4px;font-size:16px;border-bottom:1px solid var(--line)}
  main{padding:16px 14px 120px}
  .hero2{padding:28px 0 18px}.stats{gap:8px}.stat b{font-size:24px}
  .tabs{overflow-x:auto;flex-wrap:nowrap!important;padding-bottom:6px;scrollbar-width:none}.tabs button{flex:none}
  .br{scroll-snap-type:x proximity}.col{min-width:78vw;scroll-snap-align:start}
  input,select,textarea{font-size:16px}
  button,.btn{min-height:44px}
}
@media(max-width:700px){
  .adm .card.scroll{background:none;border:0;padding:0}
  .adm table,.adm tbody,.adm tr,.adm td{display:block;width:100%}
  .adm tr.hd{display:none}
  .adm tr{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:6px 12px;background:var(--panel)}
  .adm td{border:0;padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  .adm td::before{content:attr(data-l);color:var(--mut);font-size:12px;text-align:left;flex:none}
  .adm td[data-l=""]::before,.adm td.row::before{display:none}
  .adm td.row{justify-content:flex-start;text-align:left}
  .adm td.row button{flex:1 1 auto}
  .adm td select{width:auto;max-width:60%}
}
.lg{display:block;margin:0 auto 6px;width:min(340px,72vw);height:auto;mix-blend-mode:screen}
.logo .fgi{height:36px;width:36px;border-radius:8px;vertical-align:middle;margin-right:8px;object-fit:cover}
/* ===== V8: más móvil ===== */
a.card:active,button:active,.btn:active{transform:scale(.97)}a.card,button,.btn{transition:transform .08s}
.mdl,.pop{overscroll-behavior:contain}
.pop{min-height:100dvh}
@media(max-width:860px){
  header.open{max-height:100dvh;overflow-y:auto}
  .leg{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.leg>div{flex:none}
  .rk-t th,.rk-t td{padding:9px 4px;font-size:13px}.rk-t th:nth-child(6),.rk-t td:nth-child(6){display:none}
  .adsticky{gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom))}.adsticky .ad img{height:32px}.adsticky button{min-width:96px;padding:6px 10px}
  h1{font-size:26px}h2{font-size:21px}
}
/* ===== V9: minimalista móvil + comunidad ===== */
body{font-size:15px;-webkit-font-smoothing:antialiased}
.sec{margin:26px 0 10px;font-size:18px}.coins{color:var(--warn);font-weight:600;font-size:14px}button:disabled{opacity:.5}
.hub{padding:4px 14px;margin:14px 0}.hubh{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.hr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}.hr+.hr{border-top:1px solid var(--line)}
.sa{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#12305a;display:grid;place-items:center;font-size:22px;flex:none}
.bdg{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.bdg div{text-align:center;font-size:12px;padding:10px 4px;border:1px solid var(--line);border-radius:10px}.bdg b{display:block;font-size:26px}.bdg .off{opacity:.35;filter:grayscale(1)}
#app>*{animation:fi .22s ease both}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){#app>*{animation:none}}
@media(max-width:860px){
 header{flex-wrap:nowrap;padding:8px 14px;padding-top:max(8px,env(safe-area-inset-top))}
 .logo{font-size:17px;white-space:nowrap}.logo .fgi{height:30px;width:30px;margin-right:6px}
 .mb{padding:7px 12px;min-height:40px;font-size:14px}

<body>
<header id="top"></header>
<div id="adtop"></div>
<main id="app"><p class="mut">Cargando...</p></main>
<footer id="foot"></footer>
<div id="adbar"></div>
<div id="toast" role="status"></div>
<script>
// ====== CONFIGURACIÓN ======
const SUPABASE_URL = 'https://ehffewpqzmadlulxjslt.supabase.co'; // verificá que sea la Project URL de tu proyecto
const SUPABASE_KEY = 'sb_publishable_RAXrXtIVXwPgocQxiFSmtA_e7LpeOZM';
// ===========================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'pkce' } });
const app = document.getElementById('app');
let me = null, profile = null, adminTab = 'torneos';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = {coming_soon:'Próximamente',open:'Inscripciones abiertas',full:'Completo',in_progress:'En curso',finished:'Finalizado',cancelled:'Cancelado'};
const RS = {pending:['Pendiente','warn'],confirmed:['Confirmada','ok'],rejected:['Rechazada','bad'],cancelled:['Cancelada','bad'],approved:['Aprobado','ok']};
const fdate = d => d ? new Date(d + 'T00:00').toLocaleDateString('es-AR') : '';
const tag = (s) => { const r = RS[s] || [s,'']; return `<span class="tag ${r[1]}">${r[0]}</span>`; };
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500);}
const isAdmin = () => profile && profile.role === 'admin';

function header(){
  const h = location.hash || '#/';
  const l = (href, txt) => `<a href="${href}" class="${h===href?'on':''}">${txt}</a>`;
  document.getElementById('top').innerHTML = `<span class="logo">FAST<b>GAME</b> ESPORTS</span>${l('#/','Torneos')}${l('#/ranking','Ranking')}`
    + (isAdmin() ? l('#/admin','Admin') : '')
    + (me ? `<a href="#/perfil">${esc(profile?.nick || 'Perfil')}</a><a href="#" onclick="logout();return false">Salir</a>` : l('#/login','Ingresar'));
}
async function loadMe(){
  const { data:{ session } } = await sb.auth.getSession();
  me = session?.user || null; profile = null;
  if (me) { const { data } = await sb.from('profiles').select('*').eq('id', me.id).single(); profile = data; }
}
async function logout(){ await sb.auth.signOut(); await loadMe(); location.hash = '#/'; route(); }

async function route(){
  header();
  const h = location.hash || '#/';
  try {
    if (h.startsWith('#/torneo/')) await viewTournament(h.split('/')[2]);
    else if (h === '#/ranking') await viewRanking();
    else if (h === '#/login') viewLogin();
    else if (h === '#/perfil') await viewProfile();
    else if (h === '#/admin') await viewAdmin();
    else await viewHome();
  } catch (e) { app.innerHTML = `<div class="card"><h3>Algo salió mal</h3><p class="mut">${esc(e.message)}</p></div>`; }
  window.scrollTo(0, 0);
}

async function viewHome(){
  const { data, error } = await sb.from('tournaments').select('*').order('date', { ascending: true });
  if (error) throw error;
  const cards = (data || []).map(t => `<a href="#/torneo/${t.id}" class="card"><span class="tag">${ST[t.status]}</span>
    <h3 style="margin-top:8px">${esc(t.name)}</h3><div class="mut">${esc(t.game)} · ${fdate(t.date)} ${esc(t.time)}</div>
    <div style="margin-top:8px">${t.prize ? 'Premio: <b>' + esc(t.prize) + '</b><br>' : ''}${t.is_free ? 'Gratis' : '$' + t.price + ' ARS'}</div></a>`).join('');
  app.innerHTML = `<section class="hero"><h1>Competí en torneos de juegos móviles y PC</h1><p>Inscribite, jugá y subí posiciones en el ranking de la comunidad.</p></section>
    <h2 style="margin-bottom:12px">Torneos</h2>${cards ? `<div class="grid">${cards}</div>` : '<div class="card mut">Todavía no hay torneos publicados. Volvé pronto.</div>'}`;
}

async function viewTournament(id){
  const { data: t, error } = await sb.from('tournaments').select('*').eq('id', id).single();
  if (error || !t) { app.innerHTML = '<div class="card">No encontramos ese torneo.</div>'; return; }
  const { data: parts } = await sb.from('participants').select('id,nick').eq('tournament_id', id).eq('status', 'active');
  const { data: ms } = await sb.from('matches').select('*').eq('tournament_id', id).order('round').order('position');
  const bracketHtml = bracket(t, ms || [], parts || []);
  let reg = null, pay = null;
  if (me) {
    reg = (await sb.from('registrations').select('*').eq('tournament_id', id).eq('user_id', me.id).maybeSingle()).data;
    if (reg) pay = (await sb.from('payments').select('*').eq('registration_id', reg.id).maybeSingle()).data;
  }
  const cbu = (await sb.from('app_settings').select('value').eq('key', 'payment_cbu').maybeSingle()).data?.value;
  let box;
  if (!me) box = '<p>Para inscribirte, <a href="#/login">ingresá o creá tu cuenta</a>.</p>';
  else if (reg) {
    box = `<p>Tu inscripción: ${tag(reg.status)}</p>`;
    if (!t.is_free && reg.status === 'pending' && !pay) box += `<p class="mut">Pagá $${t.price} ARS${cbu ? ' a: <b>' + esc(cbu) + '</b>' : ''} y subí el comprobante.</p>
      <form onsubmit="sendReceipt(event,'${reg.id}','${t.id}',${t.price})"><input type="file" name="f" accept="image/*,.pdf" required><button>Enviar comprobante</button></form>`;
    else if (pay && pay.status === 'pending') box += '<p class="mut">Recibimos tu comprobante. Lo revisamos y confirmamos tu lugar.</p>';
  } else if (t.status === 'open' && t.registration_mode === 'open') {
    box = `<form onsubmit="register(event,'${t.id}')"><div class="two"><label>Nombre<input name="name" required value="${esc(profile?.name)}"></label><label>Nick en el juego<input name="nick" required value="${esc(profile?.nick)}"></label></div>
      <label>Celular (WhatsApp)<input name="phone" required></label><button>Inscribirme${t.is_free ? '' : ' · $' + t.price}</button></form>`;
  } else box = `<p class="mut">Las inscripciones no están abiertas (${ST[t.status]}).</p>`;
  app.innerHTML = `<div class="stack"><a href="#/">← Torneos</a><div class="card"><span class="tag">${ST[t.status]}</span><h1 style="margin:8px 0">${esc(t.name)}</h1>
    <div class="mut">${esc(t.game)} · ${fdate(t.date)} ${esc(t.time)} · ${t.total_slots ? 'Cupos libres: ' + t.available_slots + '/' + t.total_slots : 'Sin límite de cupos'}</div>
    ${t.prize ? `<p>Premio: <b>${esc(t.prize)}</b></p>` : ''}${t.info ? `<p>${esc(t.info)}</p>` : ''}${t.rules ? `<h3>Reglas</h3><p style="white-space:pre-wrap">${esc(t.rules)}</p>` : ''}</div>
    <div class="card"><h3 style="margin-bottom:10px">Inscripción</h3>${box}</div>
    ${bracketHtml}<div id="tx"></div><div class="card"><h3 style="margin-bottom:8px">Jugadores confirmados (${parts?.length || 0})</h3><div class="mut">${(parts || []).map(p => esc(p.nick)).join(' · ') || 'Todavía no hay jugadores confirmados.'}</div></div></div>`;
}
async function register(e, tid){
  e.preventDefault(); const f = new FormData(e.target);
  const { error } = await sb.rpc('register_for_tournament', { p_tournament_id: tid, p_name: f.get('name'), p_nick: f.get('nick'), p_phone: f.get('phone'), p_extra: {} });
  if (error) return toast(error.message);
  toast('¡Inscripción registrada!'); route();
}
async function sendReceipt(e, rid, tid, amount){
  e.preventDefault(); const file = e.target.f.files[0]; if (!file) return;
  const path = `${me.id}/${rid}-${Date.now()}.${(file.name.split('.').pop() || 'jpg').toLowerCase()}`;
  const up = await sb.storage.from('receipts').upload(path, file);
  if (up.error) return toast(up.error.message);
  const { error } = await sb.from('payments').insert({ registration_id: rid, tournament_id: tid, user_id: me.id, player_name: profile?.name || profile?.nick || '', amount, receipt_path: path });
  if (error) return toast(error.message);
  toast('Comprobante enviado'); route();
}

async function viewRanking(){
  const { data, error } = await sb.from('profiles').select('nick,elo_points,wins,losses,tournaments_won').eq('account_status', 'active').order('elo_points', { ascending: false }).limit(100);
  if (error) throw error;
  app.innerHTML = `<h1 style="margin-bottom:14px">Ranking</h1><div class="card scroll"><table><tr><th>#</th><th>Jugador</th><th>ELO</th><th>V</th><th>D</th><th>Torneos ganados</th></tr>
    ${(data || []).map((p, i) => `<tr><td class="pos">${i + 1}</td><td>${esc(p.nick)}</td><td><b>${p.elo_points}</b></td><td>${p.wins}</td><td>${p.losses}</td><td>${p.tournaments_won}</td></tr>`).join('') || '<tr><td colspan="6" class="mut">Todavía no hay jugadores.</td></tr>'}</table></div>`;
}

function viewLogin(){
  app.innerHTML = `<div class="card stack" style="max-width:420px;margin:20px auto"><h2>Ingresar</h2>
    <form onsubmit="login(event)"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Contraseña<input type="password" name="pw" required minlength="6" autocomplete="current-password"></label><button>Ingresar</button></form>
    <h2>Crear cuenta</h2>
    <form onsubmit="signup(event)"><label>Nick<input name="nick" required maxlength="20"></label><label>Nombre<input name="name" required></label><label>Email<input type="email" name="email" required></label>
    <label>Contraseña (mínimo 6)<input type="password" name="pw" required minlength="6" autocomplete="new-password"></label><button class="alt">Crear cuenta</button></form></div>`;
}
async function login(e){
  e.preventDefault(); const f = new FormData(e.target);
  const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('pw') });
  if (error) return toast('Email o contraseña incorrectos');
  await loadMe(); location.hash = '#/'; route();
}
async function signup(e){
  e.preventDefault(); const f = new FormData(e.target);
  const { data, error } = await sb.auth.signUp({ email: f.get('email'), password: f.get('pw'), options: { data: { nick: f.get('nick'), name: f.get('name') } } });
  if (error) return toast(error.message);
  if (!data.session) return toast('Cuenta creada. Revisá tu email para confirmarla.');
  await loadMe(); location.hash = '#/'; route();
}
async function viewProfile(){
  if (!me) { location.hash = '#/login'; return; }
  const { data: regs } = await sb.from('registrations').select('status,tournaments(id,name,date)').eq('user_id', me.id).order('created_at', { ascending: false });
  app.innerHTML = `<div class="stack"><h1>${esc(profile?.nick)}</h1><div class="card row"><div><div class="mut">ELO</div><h2>${profile?.elo_points ?? 0}</h2></div><div style="margin-left:24px"><div class="mut">Monedas</div><h2>${profile?.coins ?? 0}</h2></div></div>
    <div class="card"><h3 style="margin-bottom:8px">Mis inscripciones</h3>${(regs || []).map(r => `<div class="row" style="padding:6px 0"><a href="#/torneo/${r.tournaments.id}">${esc(r.tournaments.name)}</a><span class="mut">${fdate(r.tournaments.date)}</span>${tag(r.status)}</div>`).join('') || '<p class="mut">Todavía no te inscribiste a ningún torneo.</p>'}</div></div>`;
}

// ====== LLAVES (eliminación directa) ======
function bracket(t, ms, parts){
  const nick = id => parts.find(p => p.id === id)?.nick || '?';
  const rounds = {}; ms.forEach(m => (rounds[m.round] = rounds[m.round] || []).push(m));
  const R = Object.keys(rounds).length;
  const rname = r => r === R ? 'Final' : (r === R - 1 && R > 1) ? 'Semifinal' : (r === R - 2 && R > 2) ? 'Cuartos' : 'Ronda ' + r;
  const side = (m, pid, sc) => `<div class="side ${m.winner && m.winner === pid ? 'win' : ''}"><span>${pid ? esc(nick(pid)) : (m.status === 'finished' ? 'Libre' : 'Por definir')}</span><b>${pid && m.status === 'finished' ? sc : ''}</b></div>`;
  const card = m => `<div class="m">${side(m, m.participant_a, m.score_a)}${side(m, m.participant_b, m.score_b)}
    ${isAdmin() && m.status !== 'finished' && m.participant_a && m.participant_b ? `<div class="ctl"><input type="number" min="0" id="sa_${m.id}" value="0"><input type="number" min="0" id="sb_${m.id}" value="0"><button onclick="saveResult('${m.id}')">Guardar</button></div>` : ''}</div>`;
  const cols = Object.keys(rounds).map(r => `<div class="col"><div class="mut">${rname(+r)}</div>${rounds[r].map(card).join('')}</div>`).join('');
  return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3>Llaves</h3>${isAdmin() ? `<button class="alt" onclick="genBracket('${t.id}')">${ms.length ? 'Regenerar llaves' : 'Generar llaves'}</button>` : ''}</div>
    ${ms.length ? `<div class="br">${cols}</div>` : '<p class="mut">Las llaves se publican cuando empieza el torneo.</p>'}</div>`;
}
async function genBracket(tid){
  const { data: ps } = await sb.from('participants').select('id').eq('tournament_id', tid).eq('status', 'active');
  if (!ps || ps.length < 2) return toast('Necesitás al menos 2 jugadores confirmados');
  if (!confirm(`Se van a sortear las llaves con ${ps.length} jugadores. Si ya había llaves, se borran junto con sus resultados. ¿Seguir?`)) return;
  const ids = ps.map(p => p.id).sort(() => Math.random() - 0.5);
  let size = 2; while (size < ids.length) size *= 2;
  const half = size / 2, R = Math.log2(size), rounds = [];
  for (let r = 1; r <= R; r++) { rounds[r] = []; for (let i = 0; i < size / 2 ** r; i++) rounds[r].push({ tournament_id: tid, round: r, position: i, participant_a: null, participant_b: null, winner: null, status: 'pending' }); }
  for (let i = 0; i < half; i++) { rounds[1][i].participant_a = ids[i]; rounds[1][i].participant_b = ids[half + i] || null; }
  rounds[1].forEach((m, i) => { // pases libres
    if (!m.participant_b) {
      m.winner = m.participant_a; m.status = 'finished';
      const nx = rounds[2] && rounds[2][i >> 1];
      if (nx) { if (i % 2 === 0) nx.participant_a = m.winner; else nx.participant_b = m.winner; }
    }
  });
  const del = await sb.from('matches').delete().eq('tournament_id', tid); if (del.error) return toast(del.error.message);
  const ins = await sb.from('matches').insert(rounds.slice(1).flat()); if (ins.error) return toast(ins.error.message);
  await sb.from('tournaments').update({ status: 'in_progress' }).eq('id', tid);
  toast('Llaves generadas'); route();
}
async function saveResult(mid){
  const a = +document.getElementById('sa_' + mid).value, b = +document.getElementById('sb_' + mid).value;
  if (a === b) return toast('No puede haber empate');
  const { data: m } = await sb.from('matches').select('*').eq('id', mid).single();
  const w = a > b ? m.participant_a : m.participant_b;
  const u = await sb.from('matches').update({ score_a: a, score_b: b, winner: w, status: 'finished' }).eq('id', mid);
  if (u.error) return toast(u.error.message);
  const { data: nx } = await sb.from('matches').select('id').eq('tournament_id', m.tournament_id).eq('round', m.round + 1).eq('position', m.position >> 1).maybeSingle();
  if (nx) await sb.from('matches').update(m.position % 2 === 0 ? { participant_a: w } : { participant_b: w }).eq('id', nx.id);
  else {
    const { data: p } = await sb.from('participants').select('nick').eq('id', w).single();
    await sb.from('tournaments').update({ status: 'finished', winners: [{ position: 1, nick: p.nick }] }).eq('id', m.tournament_id);
    toast('¡Torneo finalizado! Campeón: ' + p.nick);
  }
  route();
}

// ====== PANEL ADMIN ======
async function viewAdmin(){
  if (!isAdmin()) { app.innerHTML = '<div class="card">Esta sección es solo para administradores.</div>'; return; }
  const tabs = [['torneos','Torneos'],['inscripciones','Inscripciones'],['pagos','Pagos']];
  let body = '';
  if (adminTab === 'torneos') body = await adminTournaments();
  else if (adminTab === 'inscripciones') body = await adminRegs();
  else body = await adminPayments();
  app.innerHTML = `<h1>Panel de administración</h1><div class="tabs">${tabs.map(([k, l]) => `<button class="${adminTab === k ? '' : 'alt'}" onclick="adminTab='${k}';route()">${l}</button>`).join('')}</div>${body}`;
}
async function adminTournaments(){
  const { data } = await sb.from('tournaments').select('*').order('created_at', { ascending: false });
  return `<div class="card"><h3 style="margin-bottom:10px">Crear torneo</h3><form onsubmit="createT(event)">
    <div class="two"><label>Nombre<input name="name" required></label><label>Juego<input name="game" required placeholder="Clash Royale"></label></div>
    <div class="two"><label>Fecha<input type="date" name="date" required></label><label>Hora<input type="time" name="time"></label></div>
    <div class="two"><label>Premio<input name="prize"></label><label>Cupos (0 = sin límite)<input type="number" name="slots" value="32" min="0"></label></div>
    <div class="two"><label>Precio en ARS (0 = gratis)<input type="number" name="price" value="0" min="0"></label><label>Estado<select name="status">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${k === 'open' ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
    <label>Información<textarea name="info" rows="2"></textarea></label><label>Reglas<textarea name="rules" rows="3"></textarea></label>
    <label class="row"><input type="checkbox" name="pub" style="width:auto" checked> Publicar ahora</label><button>Crear torneo</button></form></div>
    <div class="card scroll" style="margin-top:14px"><table><tr><th>Torneo</th><th>Estado</th><th>Publicado</th><th></th></tr>
    ${(data || []).map(t => `<tr><td><a href="#/torneo/${t.id}">${esc(t.name)}</a><div class="mut">${esc(t.game)} · ${fdate(t.date)}</div></td>
    <td><select onchange="setT('${t.id}',{status:this.value})">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></td>
    <td><button class="alt" onclick="setT('${t.id}',{is_published:${!t.is_published}})">${t.is_published ? 'Sí · ocultar' : 'No · publicar'}</button></td>
    <td><button class="del" onclick="delT('${t.id}')">Eliminar</button></td></tr>`).join('') || '<tr><td colspan="4" class="mut">Todavía no creaste torneos.</td></tr>'}</table></div>`;
}
async function createT(e){
  e.preventDefault(); const f = new FormData(e.target), slots = +f.get('slots') || 0, price = +f.get('price') || 0;
  const { error } = await sb.from('tournaments').insert({ name: f.get('name'), game: f.get('game'), date: f.get('date'), time: f.get('time') || '', prize: f.get('prize') || '',
    total_slots: slots, available_slots: slots, price, is_free: price === 0, status: f.get('status'), info: f.get('info') || '', rules: f.get('rules') || '', is_published: f.get('pub') === 'on' });
  if (error) return toast(error.message);
  toast('Torneo creado'); route();
}
async function setT(id, patch){ const { error } = await sb.from('tournaments').update(patch).eq('id', id); if (error) return toast(error.message); route(); }
async function delT(id){
  if (!confirm('¿Eliminar este torneo? Se borran también sus inscripciones, pagos y partidos.')) return;
  const { error } = await sb.from('tournaments').delete().eq('id', id); if (error) return toast(error.message); route();
}
async function adminRegs(){
  const { data } = await sb.from('registrations').select('*,tournaments(name)').order('created_at', { ascending: false }).limit(200);
  return `<div class="card scroll"><table><tr><th>Jugador</th><th>Torneo</th><th>Celular</th><th>Estado</th><th></th></tr>
  ${(data || []).map(r => `<tr><td>${esc(r.name)}<div class="mut">${esc(r.nick)}</div></td><td>${esc(r.tournaments?.name)}</td><td>${esc(r.phone)}</td><td>${tag(r.status)}</td>
  <td class="row"><button onclick="setReg('${r.id}','confirmed')">Confirmar</button><button class="alt" onclick="setReg('${r.id}','rejected')">Rechazar</button></td></tr>`).join('') || '<tr><td colspan="5" class="mut">No hay inscripciones.</td></tr>'}</table></div>`;

  if (file.size > 3 * 1024 * 1024 && bucket === 'avatars') { toast('La imagen pesa más de 3 MB'); return null; }
  const path = `${folder}/${Date.now()}-${file.name.replace(/[^a-z0-9.]/gi, '_')}`, up = await sb.storage.from(bucket).upload(path, file);
  if (up.error) { toast(up.error.message); return null; }
  return bucket === 'receipts' ? path : sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

async function sendPlus(e){
  e.preventDefault(); const f = new FormData(e.target), path = await uploadTo('receipts', f.get('r'), me.id); if (!path) return;
  const { error } = await sb.from('plus_requests').insert({ user_id: me.id, nick: f.get('nick'), name: f.get('name'), phone: f.get('phone'), receipt_path: path });
  if (error) return toast(error.message); toast('Comprobante enviado'); route();
}

async function addItem(e){
  e.preventDefault(); const f = new FormData(e.target); let value = f.get('value') || '';
  const file = f.get('img'); if (file && file.size) { const u = await uploadTo('public-assets', file, 'shop'); if (!u) return; value = u; }
  if (!value) return toast('Subí una imagen o escribí un valor');
  const { error } = await sb.from('shop_items').insert({ name: f.get('name'), category: f.get('category'), rarity: f.get('rarity'), price: +f.get('price') || 0, value, plus_only: f.get('plus') === 'on' });

}

async function purge(table, col, label, filt){

function brand(){
  document.querySelectorAll('.logo .fg').forEach(el => { const i = document.createElement('img'); i.src = LOGO_MARK; i.alt = 'FG'; i.className = 'fgi'; i.loading = 'eager'; el.replaceWith(i); });
  document.querySelectorAll('.hero2').forEach(h => { if (h.querySelector('.lg')) return; const i = document.createElement('img'); i.src = LOGO_FULL; i.alt = 'FastGame Esports'; i.className = 'lg'; i.loading = 'eager'; i.width = 340; i.height = 207; h.prepend(i); });
}
// ---- Publicidad insistente (vuelve): barra con 5 s de espera en cada pantalla + ventana emergente ----
const AD_WAIT = 5, AD_POP_FIRST = 2, AD_POP_EVERY = 3; // segundos de espera · ventana en la navegación Nº 2 y luego cada 3
const forceAds = () => { try { return localStorage.getItem('fge_force_ads') === '1'; } catch (e) { return false; } };
function toggleForceAds(on){ try { localStorage.setItem('fge_force_ads', on ? '1' : '0'); } catch (e) {} toast(on ? 'Ahora ves la publicidad con tu cuenta' : 'Ya no ves la publicidad con tu cuenta'); cfg = null; }
function adExtras(){
  const top = document.getElementById('adtop'), bar = document.getElementById('adbar');
  if ((location.hash || '') === '#/admin' || !showAds()) { top.innerHTML = ''; bar.innerHTML = ''; return; }
  top.innerHTML = adBox('mini');
  bar.innerHTML = `<div class="adsticky">${adBox('mini')}<button class="alt" id="adx"></button></div>`;
  countdown(document.getElementById('adx'), AD_WAIT, 'Cerrar en', () => { bar.innerHTML = ''; });
  navCount++;
  if (navCount >= AD_POP_FIRST && (navCount - AD_POP_FIRST) % AD_POP_EVERY === 0 && !document.querySelector('.adpop')) {
    const d = document.createElement('div'); d.className = 'pop adpop';
    d.innerHTML = `<div class="card stack">${adBox()}<p class="mut">¿Cansado de la publicidad? <a href="#/plus" onclick="this.closest('.pop').remove()">Pasate a FastGame Plus</a></p><button></button></div>`;
    document.body.appendChild(d); countdown(d.querySelector('button'), AD_WAIT, 'Podés cerrar en', () => d.remove());
  }
}
const _adS = adminSponsors;
adminSponsors = async function(){
  const n = sponsors.length;
  const note = `<div class="card" style="margin-bottom:14px"><b>Estado de la publicidad:</b> ${n ? n + ' sponsor(s) activo(s). Se muestra a las cuentas sin Plus.' : '<span style="color:var(--warn)">No hay sponsors activos, por eso no se muestra publicidad. Agregá o activá uno.</span>'}${isPlus() ? '<div class="mut" style="margin-top:4px">Tu cuenta tiene Plus, por eso no ves anuncios.</div>' : ''}<div class="mut" style="margin-top:4px">En esta pestaña de Admin no se muestran anuncios, para que no te interrumpan mientras editás.</div><label class="row" style="margin-top:8px"><input type="checkbox" style="width:auto" ${forceAds() ? 'checked' : ''} onchange="toggleForceAds(this.checked)"> Ver la publicidad con mi cuenta aunque tenga Plus</label></div>`;
  return note + await _adS();
};
function mobExtras(){
  document.querySelectorAll('input[type=number]').forEach(i => { if (!i.inputMode) i.inputMode = 'numeric'; });
  document.querySelectorAll('input[name=phone]').forEach(i => { i.type = 'tel'; i.autocomplete = 'tel'; });
  document.querySelectorAll('table').forEach(t => { if (t.querySelector('th')?.textContent.trim() === '#') t.classList.add('rk-t'); });
}
// ---- Recuperar y cambiar contraseña ----
let recovering = false;
async function forgot(){
  const inp = document.querySelector('form[onsubmit="login(event)"] [name=email]');
  const email = (inp && inp.value.trim()) || (prompt('Escribí tu email y te mandamos un enlace para crear una contraseña nueva:') || '').trim();
  if (!email) return;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) return toast(error.message);
  toast('Listo. Revisá tu email (también spam) y abrí el enlace desde este mismo navegador.');
}
function viewRecovery(){
  app.innerHTML = `<div class="card stack" style="max-width:420px;margin:20px auto"><h2>Elegí tu nueva contraseña</h2><form onsubmit="setNewPass(event)"><label>Nueva contraseña (mínimo 6)<input type="password" name="pw" required minlength="6" autocomplete="new-password"></label><label>Repetila<input type="password" name="pw2" required minlength="6" autocomplete="new-password"></label><button>Guardar contraseña</button></form></div>`;
}
async function setNewPass(e){
  e.preventDefault(); const f = new FormData(e.target);
  if (f.get('pw') !== f.get('pw2')) return toast('Las contraseñas no coinciden');
  const { error } = await sb.auth.updateUser({ password: f.get('pw') }); if (error) return toast(error.message);
  toast('Contraseña actualizada'); recovering = false; await loadMe(); location.hash = '#/'; route();
}
async function changePass(e){
  e.preventDefault(); const f = new FormData(e.target);
  if (f.get('pw') !== f.get('pw2')) return toast('Las contraseñas no coinciden');
  const { error } = await sb.auth.updateUser({ password: f.get('pw') }); if (error) return toast(error.message);
  e.target.reset(); toast('Contraseña cambiada');
}
const passCard = () => `<div class="card" style="margin-top:16px"><h3 style="margin-bottom:10px">Cambiar contraseña</h3><form onsubmit="changePass(event)"><div class="two"><label>Nueva contraseña<input type="password" name="pw" required minlength="6" autocomplete="new-password"></label><label>Repetila<input type="password" name="pw2" required minlength="6" autocomplete="new-password"></label></div><button>Cambiar contraseña</button></form></div>`;

async function hubCard(){

  const GM = FGS.challenge_games || 3, n = count || 0, s = (p.last_checkin === t || p.last_checkin === arDay(864e5)) ? (p.streak || 0) : 0;

  return `<div class="card hub"><div class="hubh"><b>Hoy</b><span class="mut">🔥 Racha: ${s} día${s === 1 ? '' : 's'}</span></div>

async function saveSt(e, id){
  e.preventDefault(); const f = new FormData(e.target), file = f.get('img'); let img = id ? A.st[id].image_url || '' : '';
  const url = f.get('url').trim(); if (!/^https?:\/\//.test(url)) return toast('El link tiene que empezar con https://');
  if (file && file.size) { const u = await uploadTo('public-assets', file, 'streamers'); if (!u) return; img = u; }
  const row = { name: f.get('name').trim(), platform: f.get('platform'), url, image_url: img };
  const { error } = id ? await sb.from('streamers').update(row).eq('id', id) : await sb.from('streamers').insert(row);
  if (error) return toast(error.message); closeMdl(); toast('Guardado'); route();

async function mpCard(id){
  const [ms, ps, mine] = await Promise.all([sb.from('matches').select('id,participant_a,participant_b').eq('tournament_id', id).neq('status', 'finished'), sb.from('participants').select('id,nick').eq('tournament_id', id), sb.from('match_predictions').select('match_id,pick').eq('user_id', me.id)]);
  const open = (ms.data || []).filter(m => m.participant_a && m.participant_b), nick = x => ps.data?.find(p => p.id === x)?.nick || '?', pk = Object.fromEntries((mine.data || []).map(r => [r.match_id, r.pick]));
  let el = document.getElementById('mp'); if (!el) { const tx = document.getElementById('tx'); if (!tx) return; el = document.createElement('div'); el.id = 'mp'; tx.after(el); }
  const B = (m, p) => `<button class="${pk[m.id] === p ? '' : 'alt'}" onclick="pickM('${m.id}','${p}','${id}')">${esc(nick(p))}</button>`;
  el.innerHTML = open.length ? `<div class="card"><h3>Predicciones de partidas</h3><p class="mut">Elegí quién gana cada partido: +300 🪙 y +15 XP por acierto. Podés cambiar hasta que se juegue.</p>${open.map(m => `<div class="mpr"><div class="row">${B(m, m.participant_a)}${B(m, m.participant_b)}</div></div>`).join('')}</div>` : '';
}

}

  return `<div class="card" style="margin-top:16px"><h3>Invitá amigos</h3><p class="mut">Tu código: <b>${esc(code)}</b>. Cuando un invitado juegue su primera partida, ganás un premio sorpresa (como la caja) por cada uno.</p><button onclick="shareInv('${esc(link)}')">Compartir enlace</button>${p.invited_by ? '' : `<form onsubmit="useInv(event)" class="row" style="margin-top:12px;flex-wrap:nowrap"><input name="c" placeholder="¿Te invitaron? Poné el código" required><button class="alt">Usar</button></form>`}</div>` + await collectionCard(p, me.id);
}
async function useInv(e){ e.preventDefault(); const { data, error } = await sb.rpc('fg_redeem_invite', { p_code: new FormData(e.target).get('c').trim() }); if (error) return toast(error.message); toast('¡Listo! Premio de bienvenida: +' + cf(data) + ' 🪙'); await loadMe(); route(); }

// ---- Comunidad: streamers destacados + feed ----
const ago = d => { const s = (Date.now() - new Date(d)) / 1000; return s < 60 ? 'ahora' : s < 3600 ? Math.floor(s / 60) + ' min' : s < 86400 ? Math.floor(s / 3600) + ' h' : new Date(d).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }); };
const okU = u => /^https?:\/\//.test(u || '');
const stCard = s => { const L = (Array.isArray(s.links) ? s.links : []).filter(l => okU(l.url)), nw = s.news_title && s.news_at && Date.now() - new Date(s.news_at) < 7 * 864e5;
  return `<div class="card ${s.featured ? 'ft' : ''}"><div class="row" style="flex-wrap:nowrap">${s.image_url ? `<img class="sa" src="${esc(s.image_url)}" alt="">` : '<span class="sa">🎥</span>'}<div style="flex:1"><b>${esc(s.name)}</b> ${s.featured ? '<span class="tag warn">⭐ Destacado</span>' : ''}<div class="mut">${esc(s.platform)}</div></div>${s.is_live ? '<span class="tag bad">● EN VIVO</span>' : ''}</div>${s.bio ? `<p class="mut" style="margin:8px 0">${esc(s.bio)}</p>` : ''}
  ${nw ? `<a class="nw" href="${esc(okU(s.news_url) ? s.news_url : s.url)}" target="_blank" rel="noopener">🆕 ${esc(s.news_title)}</a>` : ''}<div class="row" style="margin-top:10px"><a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Ver canal</a>${L.map(l => `<a class="btn alt2" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('')}</div></div>`; };
async function viewCommunity(){
  const [st, ps] = await Promise.all([sb.from('streamers').select('*').eq('is_active', true).order('featured', { ascending: false }).order('is_live', { ascending: false }).order('name'), sb.from('posts').select('id,body,image_url,created_at,user_id,profiles(nick,avatar_url),post_likes(user_id)').order('created_at', { ascending: false }).limit(40)]);
  const S = st.data || [], P = ps.data || [];
  app.innerHTML = `<h1>Comunidad</h1><h2 class="sec">Streamers</h2>${S.length ? `<div class="grid">${S.map(stCard).join('')}</div>` : '<div class="card mut">Pronto vas a ver acá a los creadores de la comunidad.</div>'}
  <h2 class="sec">Feed</h2><form class="card" onsubmit="post(event)"><textarea name="b" rows="2" maxlength="500" placeholder="¿Qué está pasando?"></textarea><div class="row" style="justify-content:space-between"><input type="file" name="img" accept="image/*" style="max-width:220px"><button>Publicar</button></div></form>
  <div class="stack" style="margin-top:12px">${P.map(x => { const lk = (x.post_likes || []).some(l => l.user_id === me.id), nick = x.profiles?.nick || 'Jugador'; return `<div class="card"><div class="row" style="flex-wrap:nowrap">${x.profiles?.avatar_url ? `<img class="pa" src="${esc(x.profiles.avatar_url)}" alt="">` : `<span class="pa">${esc(nick[0] || '?').toUpperCase()}</span>`}<div style="flex:1"><a href="#/jugador/${x.user_id}"><b>${esc(nick)}</b></a></div><span class="mut">${ago(x.created_at)}</span></div>${x.body ? `<div class="pb">${esc(x.body)}</div>` : ''}${okU(x.image_url) ? `<img class="pi" src="${esc(x.image_url)}" alt="">` : ''}
  <div class="row" style="margin-top:8px"><button class="alt" onclick="likeP('${x.id}',${lk})">${lk ? '❤️' : '🤍'} ${(x.post_likes || []).length}</button>${x.user_id === me.id || isAdmin() ? `<button class="alt" onclick="delPost('${x.id}')">Borrar</button>` : ''}</div></div>`; }).join('') || '<div class="card mut">Todavía no hay publicaciones. ¡Escribí la primera!</div>'}</div>`;
}
async function post(e){
  e.preventDefault(); const f = new FormData(e.target), b = f.get('b').trim(), file = f.get('img'); if (!b && !(file && file.size)) return; let img = '';
  if (file && file.size) { img = await uploadTo('public-assets', file, 'posts'); if (!img) return; }
  const { error } = await sb.from('posts').insert({ user_id: me.id, body: b, image_url: img }); if (error) return toast(error.message); route();
}
async function likeP(id, on){ const { error } = on ? await sb.from('post_likes').delete().eq('post_id', id).eq('user_id', me.id) : await sb.from('post_likes').insert({ post_id: id, user_id: me.id }); if (error) return toast(error.message); const y = scrollY; await viewCommunity(); scrollTo(0, y); }

// ---- Admin: streamers completos ----
function stForm(s, h){
  s = s || {}; const lk = (Array.isArray(s.links) ? s.links : []).map(l => l.label + ' | ' + l.url).join('\n');
  return `<form onsubmit="${h}"><div class="two"><label>Nombre<input name="name" required value="${esc(s.name)}"></label><label>Plataforma<select name="platform">${['Kick', 'YouTube', 'Twitch', 'TikTok'].map(x => `<option ${s.platform === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
  <label>Link del canal<input name="url" required placeholder="https://..." value="${esc(s.url)}"></label><label>Descripción corta<input name="bio" value="${esc(s.bio)}"></label>
  <label>Redes (una por línea: Nombre | link)<textarea name="links" rows="3" placeholder="Instagram | https://instagram.com/...">${esc(lk)}</textarea></label>
  <div class="two"><label>Novedad (video o stream nuevo)<input name="nt" value="${esc(s.news_title)}" placeholder="Nuevo video: ..."></label><label>Link de la novedad<input name="nu" value="${esc(s.news_url)}"></label></div>
  <label>Foto (opcional)<input type="file" name="img" accept="image/*"></label><label class="row"><input type="checkbox" name="ft" style="width:auto" ${s.featured ? 'checked' : ''}> Destacado</label><button>${s.id ? 'Guardar' : 'Agregar streamer'}</button></form>`;
}
function editSt(id){ mdl('Editar streamer', stForm(A.st[id], `saveSt(event,'${id}')`)); }
async function saveSt(e, id){
  e.preventDefault(); const f = new FormData(e.target), file = f.get('img'), old = id ? A.st[id] : {}; let img = old.image_url || '', url = f.get('url').trim();
  if (!okU(url)) return toast('El link tiene que empezar con https://');
  const links = f.get('links').split('\n').map(x => x.split('|').map(y => y.trim())).filter(a => a.length > 1 && okU(a[1])).map(a => ({ label: a[0] || 'Red', url: a[1] }));
  if (file && file.size) { const u = await uploadTo('public-assets', file, 'streamers'); if (!u) return; img = u; }
  const nt = f.get('nt').trim(), nu = f.get('nu').trim(), row = { name: f.get('name').trim(), platform: f.get('platform'), url, bio: f.get('bio').trim(), links, image_url: img, featured: f.get('ft') === 'on', news_title: nt, news_url: okU(nu) ? nu : '' };
  if (!nt) row.news_at = null; else if (nt !== (old.news_title || '') || nu !== (old.news_url || '')) row.news_at = new Date().toISOString();
  const { error } = id ? await sb.from('streamers').update(row).eq('id', id) : await sb.from('streamers').insert(row);
  if (error) return toast(error.message); closeMdl(); toast('Guardado'); route();
}

// ---- Admin: reglas, premios de la caja e insignias ----
const KINDS = { wins: 'Victorias', tournaments_won: 'Torneos ganados', elo_points: 'ELO', streak_best: 'Mejor racha', coins: 'Monedas', inventory_value: 'Valor del inventario', items_count: 'Cantidad de ítems', plus: 'Plus (poné 1)' };
const CR = { box_prizes: { t: 'Premios del sorteo (caja e invitaciones)', cols: [['label', 'Nombre', 'text'], ['min_coins', 'Mín. monedas', 'number'], ['max_coins', 'Máx. monedas', 'number'], ['weight', 'Peso (más alto = más probable)', 'number']] }, badges: { t: 'Insignias', cols: [['icon', 'Emoji', 'text'], ['name', 'Nombre', 'text'], ['kind', 'Se gana por', 'sel'], ['threshold', 'Valor necesario', 'number']] } };
const crForm = (tb, r, h) => { r = r || {}; return `<form onsubmit="${h}">${CR[tb].cols.map(([k, l, ty]) => `<label>${l}${ty === 'sel' ? `<select name="${k}">${Object.entries(KINDS).map(([a, b]) => `<option value="${a}" ${r[k] === a ? 'selected' : ''}>${b}</option>`).join('')}</select>` : `<input name="${k}" ${ty === 'number' ? 'type="number" min="0"' : ''} required value="${esc(r[k])}">`}</label>`).join('')}<button>${r.id ? 'Guardar' : 'Crear'}</button></form>`; };
async function crAdmin(tb){
  const c = CR[tb], { data } = await sb.from(tb).select('*').order('id'); A[tb] = {}; (data || []).forEach(r => A[tb][r.id] = r);
  return `<div class="card" style="margin-top:14px"><h3 style="margin-bottom:10px">${c.t}</h3>${crForm(tb, null, `crSave(event,'${tb}')`)}</div><div class="card scroll" style="margin-top:14px"><table><tr>${c.cols.map(x => `<th>${x[1]}</th>`).join('')}<th></th></tr>${(data || []).map(r => `<tr>${c.cols.map(x => `<td>${esc(x[2] === 'sel' ? KINDS[r[x[0]]] || r[x[0]] : r[x[0]])}</td>`).join('')}<td class="row"><button onclick="crEdit('${tb}',${r.id})">Editar</button><button class="del" onclick="crDel('${tb}',${r.id})">Eliminar</button></td></tr>`).join('') || `<tr><td colspan="${c.cols.length + 1}" class="mut">Vacío.</td></tr>`}</table></div>`;
}
function crEdit(tb, id){ mdl('Editar', crForm(tb, A[tb][id], `crSave(event,'${tb}',${id})`)); }
async function crSave(e, tb, id){
  e.preventDefault(); const f = new FormData(e.target), row = {}; CR[tb].cols.forEach(([k, , ty]) => row[k] = ty === 'number' ? +f.get(k) || 0 : String(f.get(k)).trim());
  const { error } = id ? await sb.from(tb).update(row).eq('id', id) : await sb.from(tb).insert(row); if (error) return toast(error.message); closeMdl(); toast('Guardado'); route();
}
async function crDel(tb, id){ if (!confirm('¿Eliminar?')) return; if (await dbDel(tb, 'id', id, 'Eliminado')) route(); }
const SETK = [['streak_base', 'Racha: monedas base'], ['streak_step', 'Racha: monedas extra por día (hasta el 6º)'], ['streak_bonus7', 'Racha: bonus cada 7 días'], ['challenge_games', 'Desafío: partidas necesarias'], ['challenge_reward', 'Desafío: monedas de premio'], ['pred_reward', 'Predicción de partida acertada: monedas']];
async function saveRules(e){ e.preventDefault(); const f = new FormData(e.target); const { error } = await sb.from('fg_settings').upsert(SETK.map(([k]) => ({ key: k, value: +f.get(k) || 0 }))); if (error) return toast(error.message); FGS = null; toast('Reglas guardadas'); route(); }
const _adc11 = adminCommunity;
adminCommunity = async function(){
  FGS = null; const s = await loadFGS();
  return await _adc11() + `<div class="card" style="margin-top:14px"><h3 style="margin-bottom:10px">Reglas de racha, desafío y predicciones</h3><form onsubmit="saveRules(event)">${SETK.map(([k, l]) => `<label>${l}<input type="number" min="0" name="${k}" value="${s[k] ?? FGD[k]}"></label>`).join('')}<button>Guardar reglas</button></form></div>` + await crAdmin('box_prizes') + await crAdmin('badges');
};

const _r11 = route;
route = async function(){
  await _r11(); const h = location.hash || '#/';
  if (h.startsWith('#/jugador/') && me && profile) {
    const id = h.split('/')[2], { data: p } = await sb.from('profiles').select('*').eq('id', id).maybeSingle();
    if (p) { const html = await collectionCard(p, id); if ((location.hash || '') === h) app.querySelector('.stack')?.insertAdjacentHTML('beforeend', html); }
  }
};

window.addEventListener('hashchange', route);
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { me = null; profile = null; } });
loadMe().then(route);
</script>
</body>
</html>
